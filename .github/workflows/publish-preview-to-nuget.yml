name: Publish Preview to NuGet

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  MAJOR_VERSION: 0
  MINOR_VERSION: 1
  SOLUTION_FILE: 'Ama.Enterprise.slnx'
  PACKAGE_OUTPUT_DIRECTORY: '${{ github.workspace }}/nuget'

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set Version
        id: versioning
        run: |
          # The package version format is MAJOR.MINOR.YYMMDD-ciHHMM.
          PATCH_NUMBER=$(date -u +'%y%m%d')
          BUILD_TIME=$(date -u +'%H%M')
          PACKAGE_VERSION="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${PATCH_NUMBER}-ci${BUILD_TIME}"

          # The assembly version format is Major.Minor.Build.Revision, where Build and Revision must be less than 65536.
          # We use a hardcoded epoch for 2000-01-01 to make the calculation robust.
          NOW_SECONDS=$(date -u +%s)
          CRDT_EPOCH_SECONDS=946684800 # Seconds from 1970-01-01 to 2000-01-01 UTC.
          
          if [ "$NOW_SECONDS" -lt "$CRDT_EPOCH_SECONDS" ]; then
            echo "Clock skew detected. Current time is before the year 2000."
            exit 1
          fi

          DIFF_SECONDS=$(( NOW_SECONDS - CRDT_EPOCH_SECONDS ))
          
          # Build: Days since January 1, 2000. This is guaranteed to be in the valid range.
          ASSEMBLY_BUILD_NUMBER=$(( DIFF_SECONDS / 86400 ))

          # Revision: Seconds since UTC midnight, divided by 2. This is also in the valid range.
          SECONDS_SINCE_MIDNIGHT=$(( NOW_SECONDS % 86400 ))
          ASSEMBLY_REVISION_NUMBER=$(( SECONDS_SINCE_MIDNIGHT / 2 ))
          
          ASSEMBLY_VERSION="${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${ASSEMBLY_BUILD_NUMBER}.${ASSEMBLY_REVISION_NUMBER}"
          
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
          echo "ASSEMBLY_VERSION=${ASSEMBLY_VERSION}" >> $GITHUB_ENV

          echo "Package version: ${PACKAGE_VERSION}"
          echo "Assembly version: ${ASSEMBLY_VERSION}"

      - name: Restore workloads
        run: dotnet workload restore ${{ env.SOLUTION_FILE }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}

      - name: Pack
        run: |
          dotnet pack Ama.Enterprise.CRDT.Distributed/Ama.Enterprise.CRDT.Distributed.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.CRDT.Distributed.TableStorage/Ama.Enterprise.CRDT.Distributed.TableStorage.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.CRDT.MessagePack/Ama.Enterprise.CRDT.MessagePack.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.FeatureFlags/Ama.Enterprise.FeatureFlags.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.Licensing/Ama.Enterprise.Licensing.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p/Ama.Enterprise.P2p.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p.AspNetCore/Ama.Enterprise.P2p.AspNetCore.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p.Mqtt/Ama.Enterprise.P2p.Mqtt.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p.Telemetry/Ama.Enterprise.P2p.Telemetry.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p.WebRTC/Ama.Enterprise.P2p.WebRTC.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p.WebRTC.AspNetCore/Ama.Enterprise.P2p.WebRTC.AspNetCore.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}
          dotnet pack Ama.Enterprise.P2p.WebRTC.DistributedSignaling/Ama.Enterprise.P2p.WebRTC.DistributedSignaling.csproj --configuration Release --output ${{ env.PACKAGE_OUTPUT_DIRECTORY }} -p:PackageVersion=${{ env.PACKAGE_VERSION }} -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}

      - name: List created packages
        run: ls -R ${{ env.PACKAGE_OUTPUT_DIRECTORY }}

      - name: Push to NuGet
        run: dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIRECTORY }}/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Unlist previous prerelease versions
        run: |
          packages=(
            "Ama.Enterprise.CRDT.Distributed"
            "Ama.Enterprise.CRDT.Distributed.TableStorage"
            "Ama.Enterprise.CRDT.MessagePack"
            "Ama.Enterprise.FeatureFlags"
            "Ama.Enterprise.Licensing"
            "Ama.Enterprise.P2p"
            "Ama.Enterprise.P2p.AspNetCore"
            "Ama.Enterprise.P2p.Mqtt"
            "Ama.Enterprise.P2p.Telemetry"
            "Ama.Enterprise.P2p.WebRTC"
            "Ama.Enterprise.P2p.WebRTC.AspNetCore"
            "Ama.Enterprise.P2p.WebRTC.DistributedSignaling"
          )
          for pkg in "${packages[@]}"; do
            echo "Fetching versions for $pkg..."
            # The NuGet V3 API requires lowercase package IDs
            pkg_lower=$(echo "$pkg" | tr '[:upper:]' '[:lower:]')
            
            HTTP_STATUS=$(curl -s -o versions.json -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/$pkg_lower/index.json")
            
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "Failed to fetch versions for $pkg (HTTP $HTTP_STATUS). It might be a new package or a network issue. Skipping..."
              continue
            fi
            
            # Extract versions that contain a hyphen (SemVer indicator for prerelease)
            # If you want to ONLY delete CI generated previews, change 'contains("-")' to 'contains("-ci")'
            prereleases=$(jq -r '.versions[] | select(contains("-"))' versions.json)
            
            if [ -z "$prereleases" ]; then
              echo "No prerelease versions found for $pkg."
              continue
            fi
            
            for version in $prereleases; do
              echo "Unlisting $pkg version $version..."
              dotnet nuget delete "$pkg" "$version" \
                --api-key ${{ secrets.NUGET_API_KEY }} \
                --source "https://api.nuget.org/v3/index.json" \
                --non-interactive || echo "Failed to unlist $pkg $version, but continuing..."
            done
          done